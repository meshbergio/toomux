name: release

# A tag v* builds static Linux binaries and macOS binaries and publishes them
# as a release. Run by hand, it builds them and keeps them as workflow
# artifacts only. GitHub's runners: releases are made once the repository is
# public, the Linux arm64 build needs an arm64 machine, and macOS builds need
# Apple's SDK, so they run on macOS (Apple silicon, building both).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: musl toolchain (sqlite and zstd are C)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        run: |
          name=toomux-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/toomux README.md LICENSE-MIT LICENSE-APACHE "$name"/
          tar czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz"; else shasum -a 256 "$name.tar.gz"; fi > "$name.tar.gz.sha256"
          # The Intel build can't run on an Apple silicon runner without Rosetta.
          if [ "${{ matrix.target }}" != x86_64-apple-darwin ]; then "./$name/toomux" --version; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: toomux-${{ matrix.target }}
          path: toomux-${{ matrix.target }}.tar.gz*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: src
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
      - name: verify build checksums
        run: |
          for sum in toomux-*.tar.gz.sha256; do
            sha256sum -c "$sum"
          done
      - name: software bill of materials
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: src
          format: spdx-json
          output-file: toomux.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: attest release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "toomux-*.tar.gz"
      - name: attest release SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-path: "toomux-*.tar.gz"
          sbom-path: toomux.spdx.json
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes toomux-*.tar.gz* toomux.spdx.json
      - name: homebrew tap
        # HOMEBREW_TAP_KEY is the private half of a write deploy key on
        # meshbergio/homebrew-tap: it can push there and nowhere else.
        if: env.TAP_KEY != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:meshbergio/homebrew-tap.git tap
          mkdir -p tap/Formula
          sh src/packaging/homebrew/render.sh "$version" . > tap/Formula/toomux.rb
          cd tap
          git config user.name meshbergio
          git config user.email 157935968+meshbergio@users.noreply.github.com
          git add Formula/toomux.rb
          git commit -m "toomux $version"
          git push
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: env.NPM_TOKEN != ''
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm
        # Off until an npm token that can publish toomux and @toomux/* is saved
        # here as NPM_TOKEN. npm.yml publishes an existing release by hand.
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PROVENANCE: 1
        run: sh src/packaging/npm/publish.sh "${GITHUB_REF_NAME#v}" .
