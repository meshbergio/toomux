name: release

# A tag v* builds Linux and macOS binaries and publishes them as a release.
# Windows enters the Linux build through WSL 2. The signed Android APK is
# produced with the maintainer-held release key and attached to the release
# after the tag workflow succeeds.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: release version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          android_version="$(sed -n 's/.*versionName = "\([^"]*\)"/\1/p' android/app/build.gradle.kts | head -1)"
          test -n "$cargo_version"
          test -n "$android_version"
          test "$cargo_version" = "$version"
          test "$android_version" = "$version"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: native build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools bison pkg-config
      - name: macOS build tools
        if: runner.os == 'macOS'
        run: brew install pkg-config
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: build private tmux runtime
        run: sh packaging/bundle/build-tmux-runtime.sh "$RUNNER_TEMP/toomux-runtime"
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          name=toomux-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/toomux README.md LICENSE-MIT LICENSE-APACHE "$name"/
          tar czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz"; else shasum -a 256 "$name.tar.gz"; fi > "$name.tar.gz.sha256"
          "./$name/toomux" --version

          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          sh packaging/bundle/package.sh \
            "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/toomux" \
            "$RUNNER_TEMP/toomux-runtime" \
            . \
            "$version" \
            "$GITHUB_SHA"
          sh scripts/test-self-contained-install.sh "toomux-bundle-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: toomux-${{ matrix.target }}
          path: |
            toomux-${{ matrix.target }}.tar.gz*
            toomux-bundle-${{ matrix.target }}.tar.gz*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: src
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
      - name: verify build checksums
        run: |
          for sum in toomux-*.tar.gz.sha256; do
            sha256sum -c "$sum"
          done
      - name: software bill of materials
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: src
          format: spdx-json
          output-file: toomux.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: attest release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "toomux-*.tar.gz"
      - name: attest release SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: "toomux-*.tar.gz"
          sbom-path: toomux.spdx.json
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes toomux-*.tar.gz* toomux.spdx.json
      - name: homebrew tap
        # HOMEBREW_TAP_KEY is the private half of a write deploy key on
        # meshbergio/homebrew-tap: it can push there and nowhere else.
        if: env.TAP_KEY != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:meshbergio/homebrew-tap.git tap
          mkdir -p tap/Formula
          sh src/packaging/homebrew/render.sh "$version" . > tap/Formula/toomux.rb
          cd tap
          git config user.name meshbergio
          git config user.email 157935968+meshbergio@users.noreply.github.com
          git add Formula/toomux.rb
          git commit -m "toomux $version"
          git push
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.NPM_TOKEN != ''
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm
        # Off until an npm token that can publish toomux and @toomux/* is saved
        # here as NPM_TOKEN. npm.yml publishes an existing release by hand.
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PROVENANCE: 1
        run: sh src/packaging/npm/publish.sh "${GITHUB_REF_NAME#v}" .
