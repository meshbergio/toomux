name: release

# A tag v* builds static Linux binaries and macOS binaries and publishes them
# as a release. Run by hand, it builds them and keeps them as workflow
# artifacts only. GitHub's runners: releases are made once the repository is
# public, the Linux arm64 build needs an arm64 machine, and macOS builds need
# Apple's SDK, so they run on macOS (Apple silicon, building both).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain (sqlite and zstd are C)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        run: |
          name=toomux-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/toomux README.md LICENSE-MIT LICENSE-APACHE "$name"/
          tar czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz"; else shasum -a 256 "$name.tar.gz"; fi > "$name.tar.gz.sha256"
          # The Intel build can't run on an Apple silicon runner without Rosetta.
          if [ "${{ matrix.target }}" != x86_64-apple-darwin ]; then "./$name/toomux" --version; fi
      - uses: actions/upload-artifact@v4
        with:
          name: toomux-${{ matrix.target }}
          path: toomux-${{ matrix.target }}.tar.gz*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes toomux-*.tar.gz*
      - name: homebrew tap
        # Off until meshbergio/homebrew-tap exists and a token that can push
        # to it is saved here as HOMEBREW_TAP_TOKEN.
        if: env.TAP_TOKEN != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/meshbergio/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sh src/packaging/homebrew/render.sh "$version" . > tap/Formula/toomux.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/toomux.rb
          git commit -m "toomux $version"
          git push
