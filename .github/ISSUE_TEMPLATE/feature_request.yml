name: Feature request
description: Propose a focused improvement
title: "feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas that aren't fully formed yet are welcome in [Discussions](https://github.com/meshbergio/toomux/discussions) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or failure is hard today? A concrete example helps most.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: The behaviour you want, rather than only an implementation.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints or alternatives
      description: Compatibility, performance, safety, or simpler alternatives you considered.
