name: Feature request
description: Propose a focused improvement
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or failure mode is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior you want, rather than only an implementation.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints or alternatives
      description: Compatibility, performance, safety, or simpler alternatives considered.
