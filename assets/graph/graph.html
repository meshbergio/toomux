<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>toomux memory</title>
<style>
:root {
  --base: #0f141c; --well: #0b0f15; --raised: #141b26; --overlay: #18202e;
  --sel: #22304a; --hover: #151d2a; --hair: #263041; --hair2: #34415a;
  --text: #dbe2ec; --dim: #97a3b6; --muted: #6d7a8e;
  --accent: #7dd3fc; --working: #f5a623; --attention: #f7788c; --finished: #3ecf8e;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --panel-w: 392px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--base); color: var(--text); overflow: hidden;
  font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
kbd { font: 10.5px/1 var(--mono); color: var(--muted); border: 1px solid var(--hair); border-radius: 3px; padding: 2px 4px; background: var(--well); }

#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: default; }
#sky.grab { cursor: grabbing; }
#sky.point { cursor: pointer; }
#vignette { position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 55%, rgba(11,15,21,.55) 100%); }

/* header */
#top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 18px;
  padding: 12px 16px 22px; pointer-events: none;
  background: linear-gradient(to bottom, rgba(15,20,28,.94) 0%, rgba(15,20,28,.7) 55%, rgba(15,20,28,0) 100%); }
#top > * { pointer-events: auto; }
.brand { font: 600 13px/1 var(--mono); letter-spacing: .02em; white-space: nowrap; display: flex; align-items: baseline; gap: 7px; }
.brand .slash { color: var(--hair2); font-weight: 400; }
.brand .sub { color: var(--dim); font-weight: 400; }
#counts { font: 11.5px/1.4 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
#counts b { color: var(--dim); font-weight: 400; }
#counts .made { color: var(--muted); }
#counts .c, #counts .made { white-space: nowrap; }
#counts .sep { color: var(--hair2); padding: 0 6px; }
#status { font: 11px/1 var(--mono); color: var(--accent); white-space: nowrap; }

.search { position: relative; width: 320px; flex: none; }
.search svg { position: absolute; left: 10px; top: 50%; margin-top: -6px; width: 12px; height: 12px; stroke: var(--muted); fill: none; stroke-width: 1.6; pointer-events: none; }
#q { width: 100%; height: 32px; padding: 0 34px 0 30px; border-radius: 6px; border: 1px solid var(--hair);
  background: var(--well); font: 12.5px/1 var(--mono); color: var(--text); outline: none; -webkit-appearance: none; appearance: none; }
#q::placeholder { color: var(--muted); }
#q:focus { border-color: #3d5575; box-shadow: 0 0 0 3px rgba(125,211,252,.10); }
#q::-webkit-search-cancel-button { display: none; }
.search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; }
#q:focus + kbd, #q:not(:placeholder-shown) + kbd { display: none; }
#results { position: absolute; top: 38px; right: 0; width: min(460px, calc(100vw - 32px)); max-height: min(62vh, 560px); overflow: auto;
  margin: 0; padding: 4px; list-style: none; background: var(--raised); border: 1px solid var(--hair); border-radius: 8px;
  box-shadow: 0 18px 50px rgba(0,0,0,.5); }
#results[hidden] { display: none; }
#results li { display: grid; grid-template-columns: 14px 1fr auto; gap: 2px 9px; align-items: center; padding: 7px 8px; border-radius: 5px; cursor: pointer; }
#results li[aria-selected="true"] { background: var(--sel); }
#results li:hover { background: var(--hover); }
#results li[aria-selected="true"]:hover { background: var(--sel); }
#results .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
#results .meta { grid-column: 2 / 4; font: 11px/1.3 var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#results .age { font: 11px/1 var(--mono); color: var(--muted); }
#results .more { display: block; padding: 8px; font: 11px/1.3 var(--mono); color: var(--muted); cursor: default; }
#results .more:hover { background: none; }
mark { background: none; color: var(--accent); }

/* glyphs */
.g { display: inline-block; width: 10px; height: 10px; flex: none; justify-self: center; position: relative; }
.g-project { width: 11px; height: 11px; border-radius: 50%; background: #1b2433; box-shadow: inset 0 0 0 1px #4a5b77; }
.g-project::after { content: ""; position: absolute; left: 4px; top: 4px; width: 3px; height: 3px; border-radius: 50%; background: var(--dim); }
.g-file, .g-note { width: 5px; height: 5px; border-radius: 50%; background: var(--text); box-shadow: 0 0 5px rgba(219,226,236,.55); }
.g-memory { width: 5px; height: 5px; border-radius: 50%; background: var(--text); box-shadow: 0 0 5px rgba(219,226,236,.55), 7px -1px 0 -1px var(--text), 3px 5px 0 -1.5px var(--text); margin-right: 5px; }
.g-index { width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1.3px var(--text); }
.g-index::after { content: ""; position: absolute; left: 3.5px; top: 3.5px; width: 2px; height: 2px; border-radius: 50%; background: var(--text); }
.g-session { width: 10px; height: 10px; border-radius: 50%; background: rgba(125,211,252,.3); box-shadow: inset 0 0 0 1.2px var(--accent); }
.g-handover, .g-brief { width: 7px; height: 7px; background: var(--working); transform: rotate(45deg); box-shadow: 0 0 6px rgba(245,166,35,.55); }
.g-turn { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); opacity: .85; }
.g-output { width: 4px; height: 4px; background: var(--dim); }
.g-recall { width: 14px; height: 0; border-top: 1.5px dashed var(--finished); }

/* layers */
#layers { position: fixed; left: 16px; bottom: 16px; width: 196px; padding: 6px; border: 1px solid var(--hair); border-radius: 8px;
  background: rgba(11,15,21,.9); }
#layers h2, #timebar h2 { margin: 2px 6px 6px; font: 600 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
#layers button { display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 8px; width: 100%; padding: 5px 6px; border-radius: 5px; text-align: left; font: 12px/1.2 var(--mono); color: var(--text); }
#layers button:hover { background: var(--hover); }
#layers button .n { color: var(--muted); font-size: 11px; }
#layers button[aria-pressed="false"] { color: var(--muted); }
#layers button[aria-pressed="false"] .g { opacity: .28; filter: grayscale(1); }
#layers button[aria-pressed="false"] .n { color: #4e5a6c; }
#layers .hint { display: grid; grid-template-columns: auto auto; justify-content: space-between; gap: 1px 10px; margin: 6px 6px 2px; padding-top: 7px; border-top: 1px solid var(--hair); font: 10.5px/1.6 var(--mono); color: var(--muted); }
#layers .hint span { white-space: nowrap; }
#layers .hint b { color: var(--dim); font-weight: 400; }
#layers .more { display: none; position: absolute; top: 4px; bottom: 4px; width: 30px; padding: 0; place-items: center; font: 17px/1 var(--mono); color: var(--text); }
#layers .more:hover { background: none; color: var(--accent); }
#layers .more.l { left: 2px; }
#layers .more.r { right: 2px; }

/* time */
#timebar { position: fixed; left: 228px; right: 16px; bottom: 16px; height: 66px; display: grid; grid-template-columns: 34px 1fr 304px; align-items: center; gap: 12px;
  padding: 8px 12px 8px 10px; border: 1px solid var(--hair); border-radius: 8px; background: rgba(11,15,21,.9); max-width: 980px; }
body.panel-open.wide #timebar { right: calc(var(--panel-w) + 28px); }
#play { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--hair2); display: grid; place-items: center; color: var(--text); }
#play:hover { border-color: var(--accent); color: var(--accent); }
#play svg { width: 11px; height: 11px; fill: currentColor; }
#track { position: relative; height: 44px; }
#hist { position: absolute; left: 0; right: 0; top: 0; width: 100%; height: 30px; pointer-events: none; }
#axis { position: absolute; left: 0; right: 0; top: 32px; height: 12px; font: 10px/12px var(--mono); color: var(--muted); pointer-events: none; }
#axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
#scrub { position: absolute; left: 0; right: 0; top: 0; width: 100%; height: 32px; margin: 0; background: none; -webkit-appearance: none; appearance: none; cursor: ew-resize; }
#scrub::-webkit-slider-runnable-track { height: 32px; background: none; }
#scrub::-moz-range-track { height: 32px; background: none; }
#scrub::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 32px; border: 0; border-radius: 2px;
  background: linear-gradient(to right, transparent 4.5px, var(--accent) 4.5px, var(--accent) 6.5px, transparent 6.5px); }
#scrub::-moz-range-thumb { width: 2px; height: 32px; border: 0; border-radius: 1px; background: var(--accent); }
#scrub:focus-visible { outline-offset: 3px; }
#when { font: 11.5px/1.45 var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#when b { display: block; color: var(--text); font-weight: 500; font-size: 12.5px; }
#when span { color: var(--muted); font-size: 11px; }

/* zoom */
#zoom { position: fixed; right: 16px; bottom: 98px; display: flex; flex-direction: column; border: 1px solid var(--hair); border-radius: 8px; background: rgba(11,15,21,.9); overflow: hidden; }
body.panel-open.wide #zoom { right: calc(var(--panel-w) + 28px); }
#zoom button { width: 34px; height: 32px; display: grid; place-items: center; font: 15px/1 var(--mono); color: var(--dim); }
#zoom button + button { border-top: 1px solid var(--hair); }
#zoom button:hover { color: var(--text); background: var(--hover); }
#zoom .fit { font-size: 10px; letter-spacing: .06em; }

/* hover card */
#card { position: fixed; left: 0; top: 0; max-width: 340px; padding: 9px 11px 10px; border: 1px solid var(--hair2); border-radius: 7px;
  background: rgba(20,27,38,.97); box-shadow: 0 12px 34px rgba(0,0,0,.5); pointer-events: none; z-index: 5; }
#card[hidden] { display: none; }
#card .k { display: flex; align-items: center; gap: 7px; font: 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
#card .t { margin-top: 6px; font-size: 13px; line-height: 1.35; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
#card .m { margin-top: 4px; font: 11px/1.4 var(--mono); color: var(--dim); }
#card .x { margin-top: 6px; font-size: 12px; line-height: 1.4; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }

/* panel */
#panel { position: fixed; top: 62px; right: 12px; bottom: 12px; width: var(--panel-w); display: flex; flex-direction: column;
  background: var(--raised); border: 1px solid var(--hair); border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.45); z-index: 3; }
#panel[hidden] { display: none; }
#panel .grip { display: none; }
.p-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 0 16px; font: 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.p-head .kind { flex: 1; }
.p-head button { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); font: 16px/1 var(--mono); }
.p-head button:hover { color: var(--text); background: var(--hover); }
.p-head button[disabled] { opacity: .3; cursor: default; background: none; }
.p-body { overflow: auto; padding: 4px 16px 18px; flex: 1; overscroll-behavior: contain; }
.p-title { margin: 6px 0 4px; font: 600 15.5px/1.35 var(--sans); color: var(--text); word-break: break-word; }
.p-proj { font: 11.5px/1.4 var(--mono); color: var(--muted); }
.p-proj button { color: var(--dim); text-decoration: underline; text-decoration-color: var(--hair2); text-underline-offset: 3px; }
.p-proj button:hover { color: var(--accent); }
.facts { display: grid; grid-template-columns: 92px 1fr; gap: 5px 10px; margin: 14px 0 0; padding: 12px 0 0; border-top: 1px solid var(--hair); font: 11.5px/1.45 var(--mono); }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; color: var(--text); min-width: 0; word-break: break-all; }
.facts dd span { color: var(--muted); }
.copy { display: flex; align-items: center; gap: 6px; }
.copy code { flex: 1; min-width: 0; font: 11.5px/1.45 var(--mono); color: var(--text); word-break: break-all; }
.copy button { flex: none; font: 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 4px 6px; border: 1px solid var(--hair); border-radius: 4px; }
.copy button:hover { color: var(--accent); border-color: #3d5575; }
.copy button.done { color: var(--finished); border-color: rgba(62,207,142,.4); }
.cmd { margin-top: 12px; padding: 8px 10px; border-radius: 6px; background: var(--well); border: 1px solid var(--hair); }
.cmd code::before { content: "$ "; color: var(--muted); }
.p-sec { margin-top: 18px; }
.p-sec h3 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 7px; font: 600 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.p-sec h3 .c { color: var(--dim); font-weight: 400; letter-spacing: 0; }
.preview { margin: 0; padding: 10px 12px; border-left: 2px solid var(--hair2); background: rgba(11,15,21,.6); border-radius: 0 6px 6px 0;
  white-space: pre-wrap; word-break: break-word; font: 12.5px/1.55 var(--sans); color: #c3ccd9; max-height: 320px; overflow: auto; }
.preview.empty { color: var(--muted); font-style: italic; }
.rel { list-style: none; margin: 0; padding: 0; }
.rel li button { display: grid; grid-template-columns: 14px 1fr auto; gap: 9px; align-items: center; width: 100%; padding: 5px 6px; margin: 0 -6px; border-radius: 5px; text-align: left; }
.rel li button { width: calc(100% + 12px); }
.rel li button:hover { background: var(--hover); }
.rel li button.cursor { background: var(--sel); box-shadow: inset 2px 0 0 var(--accent); }
.rel .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; color: #cdd5e1; }
.rel .age { font: 10.5px/1 var(--mono); color: var(--muted); }
.rel .hid .lbl { color: var(--dim); }
.rel .all { margin-top: 3px; font: 11px/1 var(--mono); color: var(--accent); padding: 5px 0; }
.rel .all:hover { text-decoration: underline; }
.line { display: flex; flex-wrap: wrap; align-items: center; row-gap: 8px; padding: 2px 0; }
.stop { position: relative; width: 17px; height: 20px; display: grid; place-items: center; border-radius: 4px; }
.stop::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: rgba(245,166,35,.42); }
.stop:first-child::before { left: 50%; }
.stop:last-child::before { right: 50%; }
.stop span { position: relative; display: block; }
.s-session span { width: 9px; height: 9px; border-radius: 50%; background: #1d3445; box-shadow: inset 0 0 0 1.3px var(--accent); }
.s-handover span { width: 7px; height: 7px; background: var(--working); transform: rotate(45deg); }
.stop:hover span { transform: scale(1.35); }
.s-handover:hover span { transform: rotate(45deg) scale(1.35); }
.stop.here span { outline: 1.5px solid var(--text); outline-offset: 2.5px; }
.s-session.here span { border-radius: 50%; }
.line-cap { margin-top: 6px; font: 11px/1.4 var(--mono); color: var(--muted); }

/* empty */
#empty { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; }
#empty[hidden] { display: none; }
#empty .in { max-width: 420px; padding: 24px; }
#empty .ring { width: 54px; height: 54px; margin: 0 auto 22px; border-radius: 50%; border: 1px dashed var(--hair2); position: relative; }
#empty .ring::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: var(--dim); box-shadow: 0 0 8px rgba(219,226,236,.5); }
#empty h1 { margin: 0 0 8px; font: 500 15px/1.4 var(--mono); color: var(--text); }
#empty p { margin: 0; font: 12.5px/1.6 var(--sans); color: var(--muted); }
#empty code { font: 12px var(--mono); color: var(--dim); }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* tablet and narrower: bottom sheet */
@media (max-width: 899px) {
  #top { flex-wrap: wrap; row-gap: 6px; padding-bottom: 20px;
    background: linear-gradient(to bottom, rgba(15,20,28,.97) 0%, rgba(15,20,28,.9) 65%, rgba(15,20,28,0) 100%); }
  #counts { order: 3; flex-basis: 100%; white-space: normal; font-size: 11px; }
  .search { width: auto; flex: 1; min-width: 180px; }
  #layers { left: 12px; right: 12px; bottom: 90px; width: auto; padding: 4px; }
  #layers .chips { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain; }
  #layers .chips::-webkit-scrollbar { display: none; }
  /* more chips off either edge: fade them out and show a chevron */
  #layers.more-r .chips { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 56px), transparent calc(100% - 8px)); mask-image: linear-gradient(to right, #000 calc(100% - 56px), transparent calc(100% - 8px)); }
  #layers.more-l .chips { -webkit-mask-image: linear-gradient(to right, transparent 8px, #000 56px); mask-image: linear-gradient(to right, transparent 8px, #000 56px); }
  #layers.more-l.more-r .chips { -webkit-mask-image: linear-gradient(to right, transparent 8px, #000 56px, #000 calc(100% - 56px), transparent calc(100% - 8px)); mask-image: linear-gradient(to right, transparent 8px, #000 56px, #000 calc(100% - 56px), transparent calc(100% - 8px)); }
  #layers.more-l .more.l, #layers.more-r .more.r { display: grid; }
  #layers h2, #layers .hint { display: none; }
  #layers button { width: auto; flex: none; grid-template-columns: 14px auto auto; gap: 6px; padding: 7px 8px; }
  #timebar { left: 12px; right: 12px; bottom: 12px; height: 70px; grid-template-columns: 34px 1fr; grid-template-rows: auto auto; row-gap: 0; padding: 6px 12px; max-width: none; }
  #timebar #when { grid-column: 1 / 3; grid-row: 1; }
  #timebar #when b { display: inline; margin-right: 8px; }
  #play { grid-row: 2; }
  #track { grid-row: 2; height: 38px; }
  #hist { height: 24px; } #scrub, #scrub::-webkit-slider-runnable-track { height: 26px; } #scrub::-webkit-slider-thumb { height: 26px; }
  #axis { top: 26px; }
  #zoom { right: 12px; bottom: 148px; }
  #panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 58vh; max-height: 58vh; border-radius: 14px 14px 0 0; border-bottom: 0; }
  #panel .grip { display: block; width: 38px; height: 4px; margin: 8px auto 0; border-radius: 2px; background: var(--hair2); }
  .p-head { padding-top: 4px; }
  body.panel-open #layers, body.panel-open #timebar, body.panel-open #zoom { visibility: hidden; }
  .p-body { padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
}
@media (max-width: 520px) { .brand .sub { display: none; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<canvas id="sky" role="img" aria-label="Memory graph. Use the search box or the layer list to explore it with a keyboard."></canvas>
<div id="vignette"></div>

<header id="top">
  <div class="brand"><span>toomux</span><span class="slash">/</span><span class="sub">memory</span></div>
  <div id="counts"></div>
  <span id="status" aria-live="polite"></span>
  <div class="search" role="search">
    <svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="5" cy="5" r="3.8"/><path d="M8 8l3 3"/></svg>
    <input id="q" type="search" placeholder="Search memory" autocomplete="off" spellcheck="false"
      aria-label="Search labels, text and paths" aria-controls="results" aria-expanded="false" aria-autocomplete="list" role="combobox"><kbd>/</kbd>
    <ol id="results" role="listbox" aria-label="Search results" hidden></ol>
  </div>
</header>

<nav id="layers" aria-label="Layers"><h2>Layers</h2><div class="chips" id="chips"></div>
  <button type="button" class="more l" data-by="-1" tabindex="-1" aria-hidden="true">&lsaquo;</button>
  <button type="button" class="more r" data-by="1" tabindex="-1" aria-hidden="true">&rsaquo;</button></nav>

<section id="timebar" aria-label="Time">
  <button id="play" type="button" aria-label="Replay memory growing over time"></button>
  <div id="track">
    <canvas id="hist" aria-hidden="true"></canvas>
    <input id="scrub" type="range" min="0" max="1000" step="1" value="1000" aria-label="Show what existed up to this date">
    <div id="axis" aria-hidden="true"></div>
  </div>
  <output id="when" for="scrub"></output>
</section>

<div id="zoom" role="group" aria-label="Zoom">
  <button type="button" data-z="in" aria-label="Zoom in">+</button>
  <button type="button" data-z="out" aria-label="Zoom out">&minus;</button>
  <button type="button" data-z="fit" class="fit" aria-label="Fit everything in view">FIT</button>
</div>

<aside id="panel" aria-label="Selected entry" hidden>
  <div class="grip" aria-hidden="true"></div>

{

  const months = []; while (d.getTime() <= tMax) { months.push(d.getTime()); d.setMonth(d.getMonth() + 1); }
  const every = Math.max(1, Math.ceil(months.length / Math.max(1, Math.floor(w / 58))));
  months.forEach((m, j) => {
    const x = ((m - tMin) / (tMax - tMin)) * w;
    g.fillStyle = "rgba(52,65,90,.9)"; g.fillRect(Math.round(x), h - 4, 1, 4);
    if (j % every || x > w - 18) return;
    const sp = el("span", null, dMon.format(m)); sp.style.left = x + "px"; axis.append(sp);
  });
}
function valueToT(v) { return v >= 1000 ? Infinity : tMin + (v / 1000) * (tMax - tMin); }
function syncScrub() { scrub.value = T === Infinity ? 1000 : Math.round(((T - tMin) / (tMax - tMin)) * 1000); updateWhen(); drawHist(); }
function updateWhen() {
  let m = 0, s = 0, b = 0;
  for (const n of nodes) if (n.at <= T) { if (n.kind === "session") s++; else if (n.kind === "handover") b++; else if (n.kind === "file" || n.kind === "index" || n.kind === "note") m++; }
  const head = T === Infinity ? "Everything so far" : "Up to " + dDate.format(T);
  whenEl.innerHTML = `<b>${esc(head)}</b><span>${plural(m, "memory file")} · ${plural(s, "session")} · ${plural(b, "brief")}</span>`;
}
scrub.addEventListener("input", () => { stopPlay(); T = valueToT(+scrub.value); computeVisible(); updateWhen(); drawHist(); kick(); });
let playT0 = 0, playFrom = 0;
const PLAY_MS = 16000;
function playStep(now) {
  if (!playing) return false;
  const t = (now - playT0) / PLAY_MS;
  T = playFrom + t * (tMax - tMin);
  if (T >= tMax) { T = Infinity; playing = false; playBtn.innerHTML = PLAY; playBtn.setAttribute("aria-label", "Replay memory growing over time"); }
  computeVisible();
  scrub.value = T === Infinity ? 1000 : Math.round(((T - tMin) / (tMax - tMin)) * 1000);
  if (((now / 120) | 0) !== playStep._b || !playing) { playStep._b = (now / 120) | 0; updateWhen(); drawHist(); }
  return playing;
}
function startPlay() {
  if (playing) return;
  if (sel >= 0) select(-1, { fly: false });
  if (q.value) { q.value = ""; runSearch(); }
  fitAll();
  playing = true; playBtn.innerHTML = PAUSE; playBtn.setAttribute("aria-label", "Pause the replay");
  if (T === Infinity || T >= tMax) T = tMin - (tMax - tMin) * 0.01;
  playFrom = tMin; playT0 = performance.now() - ((T - tMin) / (tMax - tMin)) * PLAY_MS;
  anim.add(playStep); kick();
}
function stopPlay() { if (!playing) return; playing = false; anim.delete(playStep); playBtn.innerHTML = PLAY; playBtn.setAttribute("aria-label", "Replay memory growing over time"); updateWhen(); drawHist(); kick(); }
playBtn.addEventListener("click", () => (playing ? stopPlay() : startPlay()));

/* ------------------------------------------------------------------ keyboard */
document.addEventListener("keydown", (ev) => {
  const typing = ev.target === q || /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName) && ev.target !== scrub;
  if (ev.key === "/" && !typing) { ev.preventDefault(); q.focus(); q.select(); return; }
  if (ev.key === "Escape") {
    if (typing && ev.target === q) return;
    if (playing) { stopPlay(); return; }
    if (cursor >= 0) { cursor = -1; cursorList.forEach((b) => b.classList.remove("cursor")); kick(); return; }
    if (q.value) { q.value = ""; runSearch(); return; }
    if (sel >= 0) { select(-1, { fly: false }); return; }
    return;
  }
  if (typing || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.target.tagName === "BUTTON" && (ev.key === "Enter" || ev.key === " ")) return;
  switch (ev.key) {
    case "j": case "ArrowDown": if (sel >= 0) { ev.preventDefault(); moveCursor(1); } break;
    case "k": case "ArrowUp": if (sel >= 0) { ev.preventDefault(); moveCursor(-1); } break;
    case "Enter": case "l": case "ArrowRight": if (cursor >= 0) { ev.preventDefault(); select(cursor); } break;
    case "Backspace": case "h": case "ArrowLeft": if (backStack.length) { ev.preventDefault(); back(); } break;
    case "f": case "0": fitAll(); break;
    case "+": case "=": zoomAt(W / 2, H / 2, cam.k * 1.5); break;
    case "-": case "_": zoomAt(W / 2, H / 2, cam.k / 1.5); break;
    case " ": ev.preventDefault(); playing ? stopPlay() : startPlay(); break;
    default:
      if (/^[1-7]$/.test(ev.key)) toggleLayer(LAYERS[+ev.key - 1].key);
  }
});

/* ------------------------------------------------------------------ boot */
function header() {
  const parts = [[COUNTS.memory, "memory file"], [COUNTS.session, "session"], [COUNTS.brief, "brief"], [COUNTS.turn, "turn"], [COUNTS.output, "output"], [COUNTS.project, "project"]];
  const bits = parts.map(([n, w]) => `<span class="c"><b>${nf(n)}</b> ${w}${n === 1 ? "" : "s"}</span>`);
  if (COUNTS.recall) bits.push(`<span class="c"><b>${nf(COUNTS.recall)}</b> recall${COUNTS.recall === 1 ? "" : "s"}</span>`);
  const made = RAW && RAW.made ? `<span class="made">made ${esc(when(RAW.made))}</span>` : "";
  $("#counts").innerHTML = bits.join('<span class="sep">·</span>') + (made ? '<span class="sep">·</span>' + made : "");
  $("#counts").title = $("#counts").textContent;
}
window.addEventListener("resize", () => { resize(); });

resize();
if (!N) {
  for (const s of ["#layers", "#timebar", "#zoom", ".search", "#counts"]) $(s).style.display = "none";
  $("#empty").hidden = false;
  $("#empty-h").textContent = RAW ? "Nothing remembered yet" : "No graph in this page";
  $("#empty-p").innerHTML = RAW
    ? "Sessions, handover briefs and memory files appear here once toomux has indexed them. Open the graph again after a session or two."
    : "This page is a template. Run <code>toomux graph --open</code> to fill it with your memory.";
  kick();
  return;
}
header();
updateWhen();
buildSim();
computeVisible();
const status = $("#status");
// settle the layout over a few frames, drawing as it goes, then stop for good
fitAll(true);
status.textContent = "Arranging";
anim.add(function settle(now) {
  const t0 = performance.now();
  while (performance.now() - t0 < 14 && sim.alpha() > sim.alphaMin()) sim.tick();
  placeOrbits();
  if (!FOCUS) fitAll(true);
  const done = sim.alpha() <= sim.alphaMin();
  if (done) {
    finishLayout();
    settled = true; status.textContent = "";
    computeVisible();
    let start = -1;
    if (FOCUS != null) {
      const f = String(FOCUS);
      const n = byId.get(f) || nodes.find((x) => x.entry === f) || nodes.find((x) => x.id.slice(2).startsWith(f)) || nodes.find((x) => x.id.includes(f));
      if (n) start = n.i;
    } else if (location.hash.length > 1) {
      const n = byId.get(decodeURIComponent(location.hash.slice(1))); if (n) start = n.i;
    }
    if (start >= 0) { settled = false; select(start, { instant: true, force: true }); settled = true; }
    else fitAll(true);
  }
  return !done;
});
kick();
})();
</script>
</body>
