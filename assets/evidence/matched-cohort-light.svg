<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">Matched 33,026 call comparison before and with toomux</title><desc id="desc">Exactly 33,026 calls on each side. Context per call falls 52.5 percent, normalized cost per 1,000 calls falls 54.3 percent, calls above 400k fall 99.45 percent, and output per normalized dollar rises 81.8 percent.</desc><text x="32" y="52" fill="#121619" font-size="36" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0" opacity="1">33,026 calls. Both sides.</text><text x="32" y="82" fill="#687178" font-size="16" font-weight="500" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0" opacity="1">Main sessions + every subagent · matched, not scaled</text><line x1="32" y1="108" x2="968" y2="108" stroke="#d8dbd8" stroke-width="1" opacity="1"/><text x="442" y="140" fill="#687178" font-size="11" font-weight="700" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="1.35" opacity="1">BEFORE</text><text x="716" y="140" fill="#0f6b56" font-size="11" font-weight="700" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="1.35" opacity="1">WITH TOOMUX</text><text x="968" y="140" fill="#687178" font-size="11" font-weight="700" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="1.35" opacity="1">DELTA</text><text x="32" y="186" fill="#687178" font-size="12" font-weight="650" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0.7" opacity="1">CONTEXT / CALL</text><text x="442" y="186" fill="#687178" font-size="23" font-weight="650" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">309,783</text><text x="716" y="186" fill="#0f6b56" font-size="23" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">147,188</text><text x="968" y="186" fill="#0f6b56" font-size="15" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">-52.5%</text><line x1="32" y1="217" x2="968" y2="217" stroke="#d8dbd8" stroke-width="1" opacity="0.9"/><text x="32" y="270" fill="#687178" font-size="12" font-weight="650" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0.7" opacity="1">NORMALIZED COST / 1,000 CALLS</text><text x="442" y="270" fill="#687178" font-size="23" font-weight="650" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">$131.59</text><text x="716" y="270" fill="#0f6b56" font-size="23" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">$60.09</text><text x="968" y="270" fill="#0f6b56" font-size="15" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">-54.3%</text><line x1="32" y1="301" x2="968" y2="301" stroke="#d8dbd8" stroke-width="1" opacity="0.9"/><text x="32" y="354" fill="#687178" font-size="12" font-weight="650" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0.7" opacity="1">CALLS ABOVE 400K</text><text x="442" y="354" fill="#687178" font-size="23" font-weight="650" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">9,194 / 27.84%</text><text x="716" y="354" fill="#0f6b56" font-size="23" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">51 / 0.154%</text><text x="968" y="354" fill="#0f6b56" font-size="15" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">-99.45% rate</text><line x1="32" y1="385" x2="968" y2="385" stroke="#d8dbd8" stroke-width="1" opacity="0.9"/><text x="32" y="438" fill="#687178" font-size="12" font-weight="650" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0.7" opacity="1">OUTPUT TOKENS / NORMALIZED $</text><text x="442" y="438" fill="#687178" font-size="23" font-weight="650" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">6,763</text><text x="716" y="438" fill="#0f6b56" font-size="23" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">12,295</text><text x="968" y="438" fill="#0f6b56" font-size="15" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">+81.8%</text></svg>