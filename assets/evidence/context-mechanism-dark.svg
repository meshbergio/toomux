<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 445" role="img" aria-labelledby="title desc"><title id="title">Where the context saving comes from</title><desc id="desc">Fresh input barely changes while cache reads and rewrite-heavy cache writes fall sharply with toomux.</desc><text x="32" y="50" fill="#f6f5f1" font-size="34" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0" opacity="1">What disappeared was old context.</text><text x="32" y="79" fill="#687178" font-size="16" font-weight="500" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0" opacity="1">Fresh input barely moved. Rewrite-heavy cache traffic did.</text><line x1="32" y1="104" x2="968" y2="104" stroke="#30363a" stroke-width="1" opacity="1"/><text x="32" y="145" fill="#f6f5f1" font-size="12" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0.5" opacity="1">CACHE READS</text><text x="255" y="137" fill="#687178" font-size="13" font-weight="650" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">9.90B</text><text x="255" y="157" fill="#57e6be" font-size="13" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">4.77B</text><rect x="318" y="133" width="470" height="4" fill="#687178" opacity="0.58"/><rect x="318" y="153" width="226.54" height="4" fill="#57e6be" opacity="1"/><text x="968" y="150" fill="#57e6be" font-size="14" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">-51.8%</text><text x="32" y="205" fill="#f6f5f1" font-size="12" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0.5" opacity="1">5-MINUTE CACHE WRITES</text><text x="255" y="197" fill="#687178" font-size="13" font-weight="650" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">298M</text><text x="255" y="217" fill="#57e6be" font-size="13" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">67.8M</text><rect x="318" y="193" width="470" height="4" fill="#687178" opacity="0.58"/><rect x="318" y="213" width="106.69" height="4" fill="#57e6be" opacity="1"/><text x="968" y="210" fill="#57e6be" font-size="14" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">-77.3%</text><text x="32" y="265" fill="#f6f5f1" font-size="12" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0.5" opacity="1">EXPIRED MID-TURN</text><text x="255" y="257" fill="#687178" font-size="13" font-weight="650" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">225M</text><text x="255" y="277" fill="#57e6be" font-size="13" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">19.4M</text><rect x="318" y="253" width="470" height="4" fill="#687178" opacity="0.58"/><rect x="318" y="273" width="40.419999999999995" height="4" fill="#57e6be" opacity="1"/><text x="968" y="270" fill="#57e6be" font-size="14" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">-91.4%</text><text x="32" y="325" fill="#f6f5f1" font-size="12" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0.5" opacity="1">EXPIRED BETWEEN TURNS</text><text x="255" y="317" fill="#687178" font-size="13" font-weight="650" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">16.1M</text><text x="255" y="337" fill="#57e6be" font-size="13" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">2.47M</text><rect x="318" y="313" width="470" height="4" fill="#687178" opacity="0.58"/><rect x="318" y="333" width="72.38" height="4" fill="#57e6be" opacity="1"/><text x="968" y="330" fill="#57e6be" font-size="14" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">-84.6%</text><text x="32" y="385" fill="#f6f5f1" font-size="12" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0.5" opacity="1">NORMAL GROWTH</text><text x="255" y="377" fill="#687178" font-size="13" font-weight="650" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">66.1M</text><text x="255" y="397" fill="#57e6be" font-size="13" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">61.1M</text><rect x="318" y="373" width="470" height="4" fill="#687178" opacity="0.58"/><rect x="318" y="393" width="433.81" height="4" fill="#57e6be" opacity="1"/><text x="968" y="390" fill="#57e6be" font-size="14" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">-7.7%</text><line x1="32" y1="413" x2="968" y2="413" stroke="#30363a" stroke-width="1" opacity="1"/><text x="32" y="439" fill="#687178" font-size="11" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="1.0" opacity="1">FRESH INPUT</text><text x="146" y="439" fill="#f6f5f1" font-size="13" font-weight="650" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">68.7k to 67.9k</text><text x="300" y="439" fill="#687178" font-size="13" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0" opacity="1">-1.2%</text><text x="968" y="439" fill="#687178" font-size="12" font-weight="500" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0" opacity="1">normal growth stays nearly flat</text></svg>