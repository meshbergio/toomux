<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 410" role="img" aria-labelledby="title desc"><title id="title">Measured and estimated token accounting</title><desc id="desc">Observed list-price usage is shown separately from estimated avoided context in a seven-day toomux tokens snapshot.</desc><text x="16" y="36" fill="#f6f5f1" font-size="24" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">Measured ≠ estimated.</text><text x="16" y="57" fill="#9aa19e" font-size="11.5" font-weight="500" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">Seven-day toomux tokens snapshot</text><line x1="16" y1="77" x2="374" y2="77" stroke="#30363a" stroke-width="1" opacity="1"/><text x="16" y="108" fill="#9aa19e" font-size="10.5" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0.8">OBSERVED</text><text x="16" y="143" fill="#f6f5f1" font-size="27" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0">$200</text><text x="374" y="143" fill="#9aa19e" font-size="11.5" font-weight="600" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">list-price usage</text><text x="16" y="176" fill="#f6f5f1" font-size="11" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">actual token traffic · cache · output · subagents</text><line x1="16" y1="202" x2="374" y2="202" stroke="#30363a" stroke-width="1" opacity="1"/><text x="16" y="235" fill="#f0b35a" font-size="10.5" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0.7">ESTIMATED COUNTERFACTUAL</text><text x="16" y="270" fill="#f0b35a" font-size="27" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0">≈ $125</text><text x="374" y="270" fill="#9aa19e" font-size="11.5" font-weight="600" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">estimated avoided</text><text x="16" y="303" fill="#f6f5f1" font-size="11" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">handover · output trimming · context not carried</text><line x1="16" y1="329" x2="374" y2="329" stroke="#30363a" stroke-width="1" opacity="1"/><text x="16" y="359" fill="#f6f5f1" font-size="11.5" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">Same report.</text><text x="374" y="359" fill="#f6f5f1" font-size="11.5" font-weight="700" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">Different epistemic status.</text><text x="16" y="390" fill="#9aa19e" font-size="10.5" font-weight="500" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">Values translated at API list prices.</text></svg>
