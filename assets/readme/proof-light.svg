<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 266" role="img" aria-labelledby="title desc"><title id="title">205-day toomux real-use snapshot</title><desc id="desc">205 days, 196.0 billion tokens, 141.7 thousand dollars at API list-price equivalent, across two Max 20x accounts.</desc><text x="32" y="48" fill="#121619" font-size="34" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">205 days of real use.</text><text x="32" y="76" fill="#687178" font-size="15" font-weight="500" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">One workload. Two Max 20x accounts. No synthetic run.</text><line x1="32" y1="100" x2="968" y2="100" stroke="#d8dbd8" stroke-width="1" opacity="1"/><text x="32" y="151" fill="#687178" font-size="10" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="1.0">DAYS</text><text x="32" y="194" fill="#121619" font-size="29" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0">205</text><line x1="246" y1="124" x2="246" y2="207" stroke="#d8dbd8" stroke-width="1" opacity="1"/><text x="278" y="151" fill="#687178" font-size="10" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="1.0">TOKENS</text><text x="278" y="194" fill="#0f6b56" font-size="29" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0">196.0B</text><line x1="492" y1="124" x2="492" y2="207" stroke="#d8dbd8" stroke-width="1" opacity="1"/><text x="524" y="151" fill="#687178" font-size="10" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="1.0">API LIST-PRICE EQUIVALENT</text><text x="524" y="194" fill="#121619" font-size="29" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0">$141.7K</text><line x1="738" y1="124" x2="738" y2="207" stroke="#d8dbd8" stroke-width="1" opacity="1"/><text x="780" y="151" fill="#687178" font-size="10" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="1.0">ACCOUNTS</text><text x="780" y="194" fill="#121619" font-size="29" font-weight="700" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0">2 × Max 20x</text><line x1="32" y1="224" x2="968" y2="224" stroke="#d8dbd8" stroke-width="1" opacity="1"/><text x="32" y="249" fill="#687178" font-size="12" font-weight="500" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">Observed Claude Code use · list-price equivalent is a pricing translation, not an invoice.</text></svg>
