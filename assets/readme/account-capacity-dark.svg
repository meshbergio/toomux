<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">How toomux treats account capacity</title><desc id="desc">Five-hour and weekly windows, reset timing and pace inform moving the same conversation and pane to an account with room.</desc><text x="32" y="48" fill="#f6f5f1" font-size="34" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">Capacity belongs to the workload.</text><text x="32" y="76" fill="#9aa19e" font-size="15" font-weight="500" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">toomux keeps account limits visible, then moves the conversation — not the job.</text><line x1="32" y1="102" x2="968" y2="102" stroke="#30363a" stroke-width="1" opacity="1"/><text x="32" y="136" fill="#9aa19e" font-size="10" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0.9">5-HOUR WINDOW</text><text x="265" y="136" fill="#9aa19e" font-size="10" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0.9">WEEKLY WINDOW</text><text x="510" y="136" fill="#9aa19e" font-size="10" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0.9">RESET</text><text x="710" y="136" fill="#9aa19e" font-size="10" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0.9">PACE</text><text x="32" y="169" fill="#f6f5f1" font-size="17" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">current usage</text><text x="265" y="169" fill="#f6f5f1" font-size="17" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">current usage</text><text x="510" y="169" fill="#f6f5f1" font-size="17" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">time remaining</text><text x="710" y="169" fill="#f6f5f1" font-size="17" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">limit trajectory</text><line x1="32" y1="194" x2="968" y2="194" stroke="#30363a" stroke-width="1" opacity="1"/><text x="32" y="234" fill="#9aa19e" font-size="14" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">conversation parked at a limit</text><line x1="257" y1="229" x2="417" y2="229" stroke="#30363a" stroke-width="1.5" opacity="1"/><circle cx="337" cy="229" r="3" fill="#57e6be"/><text x="337" y="216" fill="#57e6be" font-size="11" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0">ctrl-a</text><text x="446" y="234" fill="#f6f5f1" font-size="17" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">same conversation · same pane</text><line x1="706" y1="229" x2="852" y2="229" stroke="#30363a" stroke-width="1.5" opacity="1"/><circle cx="779" cy="229" r="3" fill="#57e6be"/><text x="968" y="234" fill="#57e6be" font-size="14" font-weight="700" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">account with room</text><text x="32" y="286" fill="#9aa19e" font-size="13" font-weight="500" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">A busy session can queue the move until idle. A session stopped at its usage limit can move at once.</text><line x1="32" y1="310" x2="968" y2="310" stroke="#30363a" stroke-width="1" opacity="1"/></svg>
