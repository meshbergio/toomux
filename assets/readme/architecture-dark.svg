<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">How toomux fits together</title><desc id="desc">One host-side toomux system used locally through the full TUI, sidebar, normal tmux and automation, or remotely through ByteTraverse from any modern browser at toomux.com/remote or the native Android app.</desc><text x="32" y="48" fill="#f6f5f1" font-size="34" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">One host. Several ways in.</text><text x="32" y="76" fill="#9aa19e" font-size="15" font-weight="500" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">Local stays local. Remote rides ByteTraverse.</text><line x1="32" y1="102" x2="968" y2="102" stroke="#30363a" stroke-width="1" opacity="1"/><text x="32" y="135" fill="#9aa19e" font-size="10" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="1.1">LOCAL ON THE HOST</text><text x="145" y="174" fill="#f6f5f1" font-size="18" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">full TUI</text><text x="145" y="198" fill="#9aa19e" font-size="12" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">alt-s</text><line x1="145" y1="214" x2="145" y2="238" stroke="#30363a" stroke-width="1.5" opacity="1"/><text x="375" y="174" fill="#f6f5f1" font-size="18" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">sidebar</text><text x="375" y="198" fill="#9aa19e" font-size="12" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">alt-b</text><line x1="375" y1="214" x2="375" y2="238" stroke="#30363a" stroke-width="1.5" opacity="1"/><text x="625" y="174" fill="#f6f5f1" font-size="18" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">normal tmux</text><text x="625" y="198" fill="#9aa19e" font-size="12" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">Claude Code stays Claude Code</text><line x1="625" y1="214" x2="625" y2="238" stroke="#30363a" stroke-width="1.5" opacity="1"/><text x="855" y="174" fill="#f6f5f1" font-size="18" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">CLI / automation</text><text x="855" y="198" fill="#9aa19e" font-size="12" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">commands · scripts</text><line x1="855" y1="214" x2="855" y2="238" stroke="#30363a" stroke-width="1.5" opacity="1"/><line x1="145" y1="238" x2="855" y2="238" stroke="#30363a" stroke-width="1.5" opacity="1"/><line x1="500" y1="238" x2="500" y2="263" stroke="#57e6be" stroke-width="1.8" opacity="1"/><text x="500" y="289" fill="#57e6be" font-size="17" font-weight="800" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0.4">TOOMUX · HOST-SIDE SYSTEM</text><line x1="100" y1="312" x2="900" y2="312" stroke="#30363a" stroke-width="1.5" opacity="1"/><text x="170" y="348" fill="#f6f5f1" font-size="16" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">sessions</text><text x="170" y="373" fill="#9aa19e" font-size="11.5" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">Claude Code · isolated tmux</text><text x="390" y="348" fill="#f6f5f1" font-size="16" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">handover + memory</text><text x="390" y="373" fill="#9aa19e" font-size="11.5" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">briefs · transcripts · recall</text><text x="610" y="348" fill="#f6f5f1" font-size="16" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">accounts + recovery</text><text x="610" y="373" fill="#9aa19e" font-size="11.5" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">limits · movement · restart</text><text x="830" y="348" fill="#f6f5f1" font-size="16" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">voyages + tokens</text><text x="830" y="373" fill="#9aa19e" font-size="11.5" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">proof · continuity · accounting</text><line x1="500" y1="396" x2="500" y2="423" stroke="#30363a" stroke-width="1.5" opacity="1"/><text x="500" y="448" fill="#9aa19e" font-size="10" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="1.0">OPTIONAL REMOTE TRANSPORT</text><line x1="500" y1="460" x2="500" y2="483" stroke="#57e6be" stroke-width="1.8" opacity="1"/><text x="500" y="507" fill="#57e6be" font-size="17" font-weight="800" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0.2">ByteTraverse</text><line x1="500" y1="520" x2="500" y2="540" stroke="#57e6be" stroke-width="1.6" opacity="1"/><line x1="300" y1="540" x2="700" y2="540" stroke="#30363a" stroke-width="1.5" opacity="1"/><line x1="300" y1="540" x2="300" y2="562" stroke="#30363a" stroke-width="1.5" opacity="1"/><line x1="700" y1="540" x2="700" y2="562" stroke="#30363a" stroke-width="1.5" opacity="1"/><text x="300" y="590" fill="#f6f5f1" font-size="15" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">BROWSER · ANY DEVICE</text><text x="300" y="614" fill="#57e6be" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0">toomux.com/remote</text><text x="300" y="636" fill="#9aa19e" font-size="11.5" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">full toomux TUI</text><text x="700" y="590" fill="#f6f5f1" font-size="15" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">NATIVE ANDROID</text><text x="700" y="614" fill="#57e6be" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0">toomux app</text><text x="700" y="636" fill="#9aa19e" font-size="11.5" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">native TUI window</text></svg>