<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 540" role="img" aria-labelledby="title desc"><title id="title">How toomux fits together</title><desc id="desc">toomux coordinates sessions, memory and accounts locally, with optional remote access to the same host-side shell from Android.</desc><text x="16" y="36" fill="#f6f5f1" font-size="24" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">One host-side system.</text><text x="16" y="57" fill="#9aa19e" font-size="11.5" font-weight="500" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">Clear boundaries. Same work.</text><line x1="16" y1="77" x2="374" y2="77" stroke="#30363a" stroke-width="1" opacity="1"/><text x="195" y="113" fill="#57e6be" font-size="16" font-weight="800" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0">TOOMUX</text><line x1="195" y1="124" x2="195" y2="151" stroke="#57e6be" stroke-width="1.5" opacity="1"/><text x="195" y="175" fill="#f6f5f1" font-size="18" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">sessions</text><text x="195" y="198" fill="#9aa19e" font-size="11.5" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">Claude Code · tmux servers</text><line x1="195" y1="210" x2="195" y2="235" stroke="#30363a" stroke-width="1.5" opacity="1"/><text x="195" y="257" fill="#f6f5f1" font-size="18" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">memory</text><text x="195" y="280" fill="#9aa19e" font-size="11.5" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">handovers · decisions · transcripts</text><line x1="195" y1="292" x2="195" y2="317" stroke="#30363a" stroke-width="1.5" opacity="1"/><text x="195" y="339" fill="#f6f5f1" font-size="18" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">accounts</text><text x="195" y="362" fill="#9aa19e" font-size="11.5" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">usage · limits · movement</text><line x1="195" y1="405" x2="195" y2="432" stroke="#30363a" stroke-width="1.5" opacity="1"/><text x="195" y="455" fill="#9aa19e" font-size="10.5" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0">optional remote</text><line x1="195" y1="466" x2="195" y2="490" stroke="#57e6be" stroke-width="1.5" opacity="1"/><text x="195" y="516" fill="#f6f5f1" font-size="15" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">Android · same host shell</text></svg>
