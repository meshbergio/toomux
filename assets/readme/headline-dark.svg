<text x="375" y="90" fill="#f6f5f1" font-size="12" font-weight="700" letter-spacing="1.3" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">CONTEXT PER CALL</text>
<text x="375" y="114" fill="#8b949a" font-size="14" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace">309,783 → 147,188</text>
