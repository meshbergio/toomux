<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 140" role="img" aria-labelledby="t d"><title id="t">toomux, measured on a matched 33,026-call workload</title><desc id="d">Cost per 1,000 calls down 54 percent, from $131.59 to $60.09. Context per call down 52 percent, from 309,783 to 147,188 tokens. Calls above 400k tokens down from 27.84 percent to 0.15 percent. Output tokens per dollar up 82 percent, from 6,763 to 12,295.</desc>
<text x="125" y="62" fill="#57e6be" font-size="44" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">−54%</text>
<text x="125" y="90" fill="#f6f5f1" font-size="12" font-weight="700" letter-spacing="1.3" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">COST PER 1,000 CALLS</text>
<text x="125" y="114" fill="#8b949a" font-size="14" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace">$131.59 → $60.09</text>
