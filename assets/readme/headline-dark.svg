<text x="625" y="62" fill="#57e6be" font-size="44" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">0.15%</text>
<text x="625" y="90" fill="#f6f5f1" font-size="12" font-weight="700" letter-spacing="1.3" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">OF CALLS ABOVE 400K</text>
