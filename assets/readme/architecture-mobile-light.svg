<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 720" role="img" aria-labelledby="title desc"><title id="title">How toomux fits together</title><desc id="desc">One host-side toomux system used locally through the full TUI, sidebar, normal tmux and automation, or remotely through ByteTraverse from any modern browser at toomux.com/remote or the native Android app.</desc><text x="16" y="36" fill="#121619" font-size="24" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">One host. Several ways in.</text><text x="16" y="58" fill="#687178" font-size="11.5" font-weight="500" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">Local stays local. Remote rides ByteTraverse.</text><line x1="16" y1="78" x2="374" y2="78" stroke="#d8dbd8" stroke-width="1" opacity="1"/><text x="16" y="108" fill="#687178" font-size="10" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0.8">LOCAL ON THE HOST</text><text x="100" y="143" fill="#121619" font-size="14.5" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">full TUI</text><text x="100" y="163" fill="#687178" font-size="10.5" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">alt-s</text><text x="290" y="143" fill="#121619" font-size="14.5" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">sidebar</text><text x="290" y="163" fill="#687178" font-size="10.5" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">alt-b</text><text x="100" y="198" fill="#121619" font-size="14.5" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">normal tmux</text><text x="100" y="218" fill="#687178" font-size="10.5" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">Claude Code</text><text x="290" y="198" fill="#121619" font-size="14.5" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">CLI / automation</text><text x="290" y="218" fill="#687178" font-size="10.5" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">commands · scripts</text><line x1="100" y1="226" x2="290" y2="226" stroke="#d8dbd8" stroke-width="1.5" opacity="1"/><line x1="195" y1="226" x2="195" y2="252" stroke="#0f6b56" stroke-width="1.7" opacity="1"/><text x="195" y="280" fill="#0f6b56" font-size="15" font-weight="800" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0.2">TOOMUX · HOST-SIDE</text><text x="195" y="308" fill="#121619" font-size="13.5" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">sessions · handover · memory</text><text x="195" y="330" fill="#687178" font-size="10.5" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">accounts · recovery · voyages · tokens</text><line x1="195" y1="352" x2="195" y2="382" stroke="#d8dbd8" stroke-width="1.5" opacity="1"/><text x="195" y="407" fill="#687178" font-size="10" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0.8">OPTIONAL REMOTE</text><line x1="195" y1="419" x2="195" y2="444" stroke="#0f6b56" stroke-width="1.7" opacity="1"/><text x="195" y="470" fill="#0f6b56" font-size="15" font-weight="800" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0">ByteTraverse</text><line x1="195" y1="482" x2="195" y2="505" stroke="#0f6b56" stroke-width="1.5" opacity="1"/><line x1="95" y1="505" x2="295" y2="505" stroke="#d8dbd8" stroke-width="1.5" opacity="1"/><line x1="95" y1="505" x2="95" y2="529" stroke="#d8dbd8" stroke-width="1.5" opacity="1"/><line x1="295" y1="505" x2="295" y2="529" stroke="#d8dbd8" stroke-width="1.5" opacity="1"/><text x="95" y="555" fill="#121619" font-size="13.5" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">BROWSER</text><text x="95" y="575" fill="#121619" font-size="12" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">any device</text><text x="95" y="598" fill="#0f6b56" font-size="10.5" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0">toomux.com/remote</text><text x="95" y="619" fill="#687178" font-size="10.5" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">full TUI</text><text x="295" y="555" fill="#121619" font-size="13.5" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">ANDROID</text><text x="295" y="575" fill="#121619" font-size="12" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">native app</text><text x="295" y="598" fill="#0f6b56" font-size="10.5" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">same host shell</text><text x="295" y="619" fill="#687178" font-size="10.5" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">native TUI</text><line x1="16" y1="650" x2="374" y2="650" stroke="#d8dbd8" stroke-width="1" opacity="1"/><text x="195" y="680" fill="#121619" font-size="12" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">Same host state · same sessions</text><text x="195" y="701" fill="#687178" font-size="10.5" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">Remote transport is optional.</text></svg>