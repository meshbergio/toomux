<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 462" role="img" aria-labelledby="title desc"><title id="title">How toomux treats account capacity</title><desc id="desc">Five-hour and weekly windows, reset timing and pace inform moving the same conversation and pane to an account with room.</desc><text x="16" y="36" fill="#f6f5f1" font-size="24" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">Capacity follows the work.</text><text x="16" y="57" fill="#9aa19e" font-size="11.5" font-weight="500" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">Limits stay visible across accounts.</text><line x1="16" y1="76" x2="374" y2="76" stroke="#30363a" stroke-width="1" opacity="1"/><text x="16" y="108" fill="#9aa19e" font-size="10.5" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0.7">5-HOUR WINDOW</text><text x="374" y="108" fill="#f6f5f1" font-size="14" font-weight="600" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">current usage</text><line x1="16" y1="128" x2="374" y2="128" stroke="#30363a" stroke-width="1" opacity="0.85"/><text x="16" y="156" fill="#9aa19e" font-size="10.5" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0.7">WEEKLY WINDOW</text><text x="374" y="156" fill="#f6f5f1" font-size="14" font-weight="600" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">current usage</text><line x1="16" y1="176" x2="374" y2="176" stroke="#30363a" stroke-width="1" opacity="0.85"/><text x="16" y="204" fill="#9aa19e" font-size="10.5" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0.7">RESET</text><text x="374" y="204" fill="#f6f5f1" font-size="14" font-weight="600" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">time remaining</text><line x1="16" y1="224" x2="374" y2="224" stroke="#30363a" stroke-width="1" opacity="0.85"/><text x="16" y="252" fill="#9aa19e" font-size="10.5" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0.7">PACE</text><text x="374" y="252" fill="#f6f5f1" font-size="14" font-weight="600" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">limit trajectory</text><line x1="16" y1="272" x2="374" y2="272" stroke="#30363a" stroke-width="1" opacity="0.85"/><text x="16" y="322" fill="#9aa19e" font-size="12" font-weight="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">conversation at a limit</text><line x1="16" y1="345" x2="374" y2="345" stroke="#30363a" stroke-width="1.5" opacity="1"/><circle cx="195" cy="345" r="3" fill="#57e6be"/><text x="195" y="337" fill="#57e6be" font-size="10.5" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0">ctrl-a</text><text x="16" y="379" fill="#f6f5f1" font-size="16" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">same conversation · same pane</text><text x="374" y="403" fill="#57e6be" font-size="13" font-weight="700" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">→ account with room</text><text x="16" y="440" fill="#9aa19e" font-size="10.5" font-weight="500" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">Busy work can queue the move until the session is idle.</text></svg>
