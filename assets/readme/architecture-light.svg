<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 454" role="img" aria-labelledby="title desc"><title id="title">How toomux fits together</title><desc id="desc">toomux coordinates sessions, memory and accounts locally, with optional remote access to the same host-side shell from Android.</desc><text x="32" y="48" fill="#121619" font-size="34" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">One host-side system.</text><text x="32" y="76" fill="#687178" font-size="15" font-weight="500" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">The product boundaries are deliberately boring.</text><line x1="32" y1="102" x2="968" y2="102" stroke="#d8dbd8" stroke-width="1" opacity="1"/><text x="500" y="150" fill="#0f6b56" font-size="18" font-weight="800" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0">TOOMUX</text><line x1="500" y1="163" x2="500" y2="193" stroke="#0f6b56" stroke-width="1.5" opacity="1"/><line x1="170" y1="193" x2="830" y2="193" stroke="#d8dbd8" stroke-width="1.5" opacity="1"/><line x1="170" y1="193" x2="170" y2="224" stroke="#d8dbd8" stroke-width="1.5" opacity="1"/><line x1="500" y1="193" x2="500" y2="224" stroke="#d8dbd8" stroke-width="1.5" opacity="1"/><line x1="830" y1="193" x2="830" y2="224" stroke="#d8dbd8" stroke-width="1.5" opacity="1"/><text x="170" y="252" fill="#121619" font-size="20" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">sessions</text><text x="170" y="279" fill="#687178" font-size="13" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">Claude Code</text><text x="170" y="301" fill="#687178" font-size="13" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">one tmux server each</text><text x="500" y="252" fill="#121619" font-size="20" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">memory</text><text x="500" y="279" fill="#687178" font-size="13" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">handovers · decisions</text><text x="500" y="301" fill="#687178" font-size="13" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">transcripts · recalls</text><text x="830" y="252" fill="#121619" font-size="20" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">accounts</text><text x="830" y="279" fill="#687178" font-size="13" font-weight="600" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">usage · limits</text><text x="830" y="301" fill="#687178" font-size="13" font-weight="500" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">movement</text><line x1="500" y1="318" x2="500" y2="348" stroke="#d8dbd8" stroke-width="1.5" opacity="1"/><text x="500" y="372" fill="#687178" font-size="12" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0">optional remote</text><line x1="500" y1="383" x2="500" y2="406" stroke="#0f6b56" stroke-width="1.5" opacity="1"/><text x="500" y="432" fill="#121619" font-size="16" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">Android · same host shell</text></svg>
