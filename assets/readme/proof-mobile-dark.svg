<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 426" role="img" aria-labelledby="title desc"><title id="title">205-day toomux real-use snapshot</title><desc id="desc">205 days, 196.0 billion tokens, 141.7 thousand dollars at API list-price equivalent, across two Max 20x accounts.</desc><text x="16" y="36" fill="#f6f5f1" font-size="24" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">205 days of real use.</text><text x="16" y="58" fill="#9aa19e" font-size="11.5" font-weight="500" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">Two Max 20x accounts · real workload</text><line x1="16" y1="78" x2="374" y2="78" stroke="#30363a" stroke-width="1" opacity="1"/><text x="16" y="116" fill="#9aa19e" font-size="10.5" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0.7">DAYS</text><text x="374" y="139" fill="#f6f5f1" font-size="21" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0">205</text><line x1="16" y1="158" x2="374" y2="158" stroke="#30363a" stroke-width="1" opacity="0.9"/><text x="16" y="186" fill="#9aa19e" font-size="10.5" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0.7">TOKENS</text><text x="374" y="209" fill="#57e6be" font-size="21" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0">196.0B</text><line x1="16" y1="228" x2="374" y2="228" stroke="#30363a" stroke-width="1" opacity="0.9"/><text x="16" y="256" fill="#9aa19e" font-size="10.5" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0.7">API LIST-PRICE EQUIVALENT</text><text x="374" y="279" fill="#f6f5f1" font-size="21" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0">$141.7K</text><line x1="16" y1="298" x2="374" y2="298" stroke="#30363a" stroke-width="1" opacity="0.9"/><text x="16" y="326" fill="#9aa19e" font-size="10.5" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0.7">ACCOUNTS</text><text x="374" y="349" fill="#f6f5f1" font-size="21" font-weight="700" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" letter-spacing="0">2 × Max 20x</text><line x1="16" y1="384" x2="374" y2="384" stroke="#30363a" stroke-width="1" opacity="1"/><text x="16" y="409" fill="#9aa19e" font-size="10.5" font-weight="500" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" letter-spacing="0">Observed use. List-price equivalent is not an invoice.</text></svg>
